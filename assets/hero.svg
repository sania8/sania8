<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Animated knowledge graph of Sania Verma's research areas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="0.5" stop-color="#141b2d"/><stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#9ece6a"/><stop offset="0.5" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.45"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
      .lbl{font-size:15px;font-weight:600}
      .sub{font-size:11px;fill:#8b98b8}
      .edge{stroke:#7aa2f7;stroke-width:1.6;stroke-dasharray:6 8;fill:none;opacity:.7;animation:flow 2.2s linear infinite}
      .cross{stroke:#bb9af7;stroke-width:1;stroke-dasharray:3 9;fill:none;opacity:.35;animation:flow 4s linear infinite reverse}
      .node{fill:#161b2e;stroke:#7aa2f7;stroke-width:2}
      .ring{fill:none;stroke:#7aa2f7;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 3s ease-out infinite}
      .float{animation:bob 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-56}}
      @keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>
  <rect width="1000" height="420" rx="18" fill="url(#bg)"/>
  <!-- starfield -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="25" r="1"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="30" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="210" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="250" r="1.1"><animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="400" r="1"><animate attributeName="opacity" values="1;.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="395" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- cross links between neighbouring nodes -->
  <path class="cross" d="M170 100 L500 52 L830 100"/>
  <path class="cross" d="M150 320 L500 372 L850 320"/>
  <path class="cross" d="M170 100 L150 320"/>
  <path class="cross" d="M830 100 L850 320"/>
  <!-- spokes (paths double as particle tracks) -->
  <path id="e1" class="edge" d="M500 210 L170 100"/>
  <path id="e2" class="edge" d="M500 210 L830 100"/>
  <path id="e3" class="edge" d="M500 210 L150 320"/>
  <path id="e4" class="edge" d="M500 210 L850 320"/>
  <path id="e5" class="edge" d="M500 210 L500 52"/>
  <path id="e6" class="edge" d="M500 210 L500 372"/>
  <!-- travelling particles -->
  <g fill="#9ece6a">
    <circle r="3.5"><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#e1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath xlink:href="#e2"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.3s" repeatCount="indefinite"><mpath xlink:href="#e3"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite"><mpath xlink:href="#e4"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#e5"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath xlink:href="#e6"/></animateMotion></circle>
  </g>
  <!-- core -->
  <circle cx="500" cy="210" r="120" fill="url(#glow)"/>
  <circle class="ring" cx="500" cy="210" r="56"/>
  <circle class="ring" cx="500" cy="210" r="56" style="animation-delay:1.5s"/>
  <circle cx="500" cy="210" r="56" fill="url(#core)"/>
  <text x="500" y="206" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#0d1117">SANIA</text>
  <text x="500" y="228" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#0d1117">VERMA</text>
  <!-- satellite nodes -->
  <g class="float"><circle class="node" cx="170" cy="100" r="30"/><text class="lbl" x="170" y="104" text-anchor="middle">LLMs</text><text class="sub" x="170" y="148" text-anchor="middle">RAG · LoRA · Agents</text></g>
  <g class="float" style="animation-delay:-1s"><circle class="node" cx="830" cy="100" r="30"/><text class="lbl" x="830" y="104" text-anchor="middle">KGs</text><text class="sub" x="830" y="148" text-anchor="middle">RDF · SPARQL · Neo4j</text></g>
  <g class="float" style="animation-delay:-2s"><circle class="node" cx="150" cy="320" r="30"/><text class="lbl" x="150" y="324" text-anchor="middle">VLA</text><text class="sub" x="150" y="368" text-anchor="middle">ROS 2 · OpenVLA · π₀.₅</text></g>
  <g class="float" style="animation-delay:-3s"><circle class="node" cx="850" cy="320" r="30"/><text class="lbl" x="850" y="324" text-anchor="middle">CV</text><text class="sub" x="850" y="368" text-anchor="middle">YOLO · U-Net · VLMs</text></g>
  <g class="float" style="animation-delay:-1.5s"><circle class="node" cx="500" cy="52" r="30"/><text class="lbl" x="500" y="56" text-anchor="middle">OCR</text><text class="sub" x="590" y="56" text-anchor="start">Document AI</text></g>
  <g class="float" style="animation-delay:-2.5s"><circle class="node" cx="500" cy="372" r="30"/><text class="lbl" x="500" y="376" text-anchor="middle">XAI</text><text class="sub" x="540" y="376" text-anchor="start">SHAP · LIME · GSMILE</text></g>
</svg>
