<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Animated terminal introducing Sania Verma" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c1"><rect x="40" y="62" height="24" width="0"><animate attributeName="width" from="0" to="120" dur="0.6s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="92" height="24" width="0"><animate attributeName="width" from="0" to="760" dur="1.4s" begin="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="132" height="24" width="0"><animate attributeName="width" from="0" to="220" dur="0.8s" begin="3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="162" height="24" width="0"><animate attributeName="width" from="0" to="820" dur="1.6s" begin="3.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="202" height="24" width="0"><animate attributeName="width" from="0" to="260" dur="0.8s" begin="5.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="232" height="24" width="0"><animate attributeName="width" from="0" to="820" dur="1.6s" begin="6.8s" fill="freeze"/></rect></clipPath>
    <style>
      text{font-family:'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace;font-size:15px;fill:#c0caf5}
      .p{fill:#9ece6a}.k{fill:#7aa2f7}.o{fill:#e0af68}.m{fill:#bb9af7}
      .cur{animation:blink 1s steps(2) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="900" height="300" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="48" cy="20" r="6" fill="#ffbd2e"/><circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" style="font-size:12px;fill:#8b949e">sania@london: ~/about</text>
  <g clip-path="url(#c1)"><text x="40" y="80"><tspan class="p">$</tspan> whoami</text></g>
  <g clip-path="url(#c2)"><text x="40" y="110" class="k">AI Engineer &amp; Researcher · MSc AI @ City St George's, University of London</text></g>
  <g clip-path="url(#c3)"><text x="40" y="150"><tspan class="p">$</tspan> cat focus.txt</text></g>
  <g clip-path="url(#c4)"><text x="40" y="180" class="o">LLMs + RAG · Knowledge Graphs · Vision-Language-Action · Document AI</text></g>
  <g clip-path="url(#c5)"><text x="40" y="220"><tspan class="p">$</tspan> ./status --now</text></g>
  <g clip-path="url(#c6)"><text x="40" y="250" class="m">Noos AI (VLA robotics) · RentGuard AI · KG poster @ UK-KG Symposium</text></g>
  <rect class="cur" x="40" y="268" width="9" height="16" fill="#9ece6a"/>
</svg>
